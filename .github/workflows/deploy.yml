name: LaCuchara Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite ejecutarlo manualmente

jobs:
  # --- TRABAJO 1: COMPILACIÓN DE NEXT.JS (WEB) ---
  build-frontend:
    runs-on: ubuntu-latest
    # Si creaste el Environment "Production", descomenta la siguiente línea:
    # environment: Production 
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Next.js Build
        run: npm run build
        env:
          # --- AQUÍ PROTEGEMOS TU KEY ---
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

  # --- TRABAJO 2: PIPELINE DE IA (PYTHON) ---
  run-ai-pipeline:
    runs-on: ubuntu-latest
    needs: build-frontend # Solo corre si la web compila bien
    # environment: Production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          if [ -f ai_pipeline/requirements.txt ]; then
            pip install -r ai_pipeline/requirements.txt
          fi

      - name: Run OCR and Processing
        run: python ai_pipeline/scripts/process_menu_ocr.py
        
