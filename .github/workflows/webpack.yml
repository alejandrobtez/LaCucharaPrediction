name: LaCuchara Full Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # IMPORTANTE: Aquí activamos tu entorno secreto
    environment: Production 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Next.js Build
      # Cambiamos "npx webpack" por el comando de Next.js
      run: npm run build
      env:
        # AQUÍ es donde GitHub inyecta tu clave secreta de Firebase
        FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
        # Añade aquí el resto si las tienes (DB_SERVER, etc.)
        DB_SERVER: ${{ secrets.DB_SERVER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    # --- OPCIONAL: PIPELINE DE IA ---
    # Si quieres que también corra tu script de Python:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run AI Pipeline
      run: |
        if [ -d ai_pipeline ]; then
          pip install -r ai_pipeline/requirements.txt
          python ai_pipeline/scripts/process_menu_ocr.py
        fi
      env:
        DB_URL: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
